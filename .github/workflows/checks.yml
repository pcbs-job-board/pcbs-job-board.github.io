# Code checks on every push and pull request: lint, formatting, and that the parts database matches its CSVs.
# Tool versions are pinned in package.json – a newer Prettier formats some lines differently and would fail the check.
# dev-* branches too (in the private dev repository), so a problem shows up before a release, not after.
name: Checks
on:
  push:
    branches: [main, "dev-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run lint
      - run: npm run format:check
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: parts-db.js is up to date
        run: |
          python tools/build_db.py
          sed -i '/^window.PARTS_META/d' data/parts-db.js && git show HEAD:data/parts-db.js | sed '/^window.PARTS_META/d' > /tmp/old.js
          diff -q /tmp/old.js data/parts-db.js || { echo "::error::data/parts-db.js is out of date – run python tools/build_db.py"; exit 1; }
